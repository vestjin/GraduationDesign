<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>云盘 - 私人存储空间</title>
    <!-- 引入 Element Plus 样式 + 字体 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <!-- 引入 Vue 3, Element Plus, Axios, SparkMD5 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
        }
        /* 全局滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        /* 文件列表表格样式增强 */
        .file-table .el-table__row:hover {
            cursor: default;
        }
        .folder-row {
            cursor: pointer;
            font-weight: 500;
        }
        .folder-row .cell {
            color: #e6a23c;
        }
        .file-icon {
            margin-right: 8px;
            font-size: 1.2em;
            vertical-align: middle;
        }
        .action-buttons .el-button + .el-button {
            margin-left: 8px;
        }
        .upload-task-list {
            margin-top: 24px;
            border-top: 1px solid #ebeef5;
            padding-top: 16px;
        }
        /* 移动文件下拉菜单样式 */
        .move-select {
            width: 100%;
        }
        .navbar-breadcrumb {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .quota-info {
            font-size: 13px;
            color: #606266;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <!-- 登录界面 -->
            <el-card v-if="!isLoggedIn" style="max-width: 450px; margin: 80px auto; padding: 20px;">
                <h2 style="text-align: center; margin-bottom: 24px;">📁 私人云盘</h2>
                <el-form :model="loginForm" :rules="loginRules" ref="loginFormRef">
                    <el-form-item prop="username">
                        <el-input v-model="loginForm.username" placeholder="用户名" prefix-icon="User" clearable></el-input>
                    </el-form-item>
                    <el-form-item prop="password">
                        <el-input v-model="loginForm.password" type="password" placeholder="密码" prefix-icon="Lock" show-password></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="doLogin" style="width: 100%" :loading="loginLoading">登录</el-button>
                        <el-button @click="doRegister" style="width: 100%; margin-top: 12px;">注册新账号</el-button>
                    </el-form-item>
                </el-form>
                <div v-if="loginMsg" style="color: #f56c6c; font-size: 13px; text-align: center;">{{ loginMsg }}</div>
            </el-card>

            <!-- 主界面 -->
            <div v-else>
                <!-- 顶部栏 -->
                <div class="navbar-breadcrumb">
                    <el-breadcrumb separator="/">
                        <el-breadcrumb-item :to="{ path: '/' }" @click="goRoot">云盘</el-breadcrumb-item>
                        <el-breadcrumb-item v-for="(item, idx) in pathStack" :key="idx">
                            <span v-if="idx === pathStack.length-1">{{ item.name }}</span>
                            <a href="#" @click.prevent="navigateTo(item.id, idx)" v-else>{{ item.name }}</a>
                        </el-breadcrumb-item>
                    </el-breadcrumb>
                    <div>
                        <el-button type="danger" plain size="small" @click="logout">退出登录</el-button>
                    </div>
                </div>

                <!-- 操作栏 -->
                <el-row :gutter="16" style="margin-bottom: 20px;">
                    <el-col :span="6">
                        <el-input v-model="newFolderName" placeholder="新建文件夹名称" clearable>
                            <template #append>
                                <el-button @click="createFolder" :loading="mkdirLoading">新建</el-button>
                            </template>
                        </el-input>
                    </el-col>
                    <el-col :span="6">
                        <el-upload
                            action="#"
                            :auto-upload="false"
                            :show-file-list="false"
                            :multiple="true"
                            :on-change="handleFileSelect"
                            :before-upload="() => false"
                            drag
                        >
                            <el-button type="primary" plain>📤 选择文件上传</el-button>
                        </el-upload>
                    </el-col>
                    <el-col :span="6" :offset="6" style="text-align: right;">
                        <span class="quota-info">已用空间: {{ formatSize(usedQuota) }} / {{ formatSize(totalQuota) }}</span>
                    </el-col>
                </el-row>

                <!-- 文件列表表格 -->
                <el-table :data="fileList" stripe border style="width: 100%" @row-dblclick="handleRowDoubleClick">
                    <el-table-column label="名称" min-width="220">
                        <template #default="{ row }">
                            <span :class="row.file_type === 1 ? 'folder-row' : ''" @click="row.file_type === 1 && enterFolder(row.file_id)">
                                <span class="file-icon">{{ row.file_type === 1 ? '📁' : getFileIcon(row.file_name) }}</span>
                                {{ row.file_name }}
                            </span>
                        </template>
                    </el-table-column>
                    <el-table-column label="大小" width="120">
                        <template #default="{ row }">
                            {{ row.file_type === 1 ? '—' : formatSize(row.file_size) }}
                        </template>
                    </el-table-column>
                    <el-table-column label="类型" width="100">
                        <template #default="{ row }">
                            {{ row.file_type === 1 ? '文件夹' : '文件' }}
                        </template>
                    </el-table-column>
                    <el-table-column label="操作" width="280" fixed="right">
                        <template #default="{ row }">
                            <div class="action-buttons">
                                <el-button v-if="row.file_type === 0" size="small" type="info" plain @click="previewFile(row.file_id, row.file_name)">预览</el-button>
                                <el-button v-if="row.file_type === 0" size="small" type="success" plain @click="downloadFile(row.file_id, row.file_name)">下载</el-button>
                                <el-button size="small" type="warning" plain @click="renameFile(row.file_id, row.file_name)">改名</el-button>
                                <el-button size="small" type="primary" plain @click="openMoveModal(row.file_id)">移动</el-button>
                                <el-button size="small" type="danger" plain @click="deleteFile(row.file_id)">删除</el-button>
                            </div>
                        </template>
                    </el-table-column>
                </el-table>

                <!-- 上传任务列表 -->
                <div class="upload-task-list">
                    <el-divider content-position="left">上传任务</el-divider>
                    <div v-for="task in activeTaskList" :key="task.id" style="margin-bottom: 12px;">
                        <el-card shadow="hover">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="flex: 1;">
                                    <div><strong>{{ task.file.name }}</strong> <span style="color: #909399;">({{ formatSize(task.file.size) }})</span></div>
                                    <el-progress :percentage="task.progress" :status="task.status === 'ERROR' ? 'exception' : (task.status === 'FINISHED' ? 'success' : '')"></el-progress>
                                    <span style="font-size: 12px; color: #606266;">{{ task.statusText }}</span>
                                </div>
                                <div style="margin-left: 16px;">
                                    <el-button v-if="task.status === 'UPLOADING'" size="small" type="warning" @click="pauseTask(task.id)">暂停</el-button>
                                    <el-button v-if="task.status === 'PAUSED'" size="small" type="primary" @click="resumeTask(task.id)">继续</el-button>
                                    <el-button v-if="task.status === 'ERROR'" size="small" type="danger" @click="retryTask(task.id)">重试</el-button>
                                    <el-button v-if="task.status === 'PENDING'" size="small" disabled>等待中</el-button>
                                </div>
                            </div>
                        </el-card>
                    </div>
                </div>
            </div>
        </div>

        <!-- 移动文件对话框 -->
        <el-dialog v-model="moveDialogVisible" title="移动文件到" width="30%">
            <el-select v-model="targetParentId" placeholder="请选择目标文件夹" class="move-select">
                <el-option label="根目录" :value="0"></el-option>
                <el-option v-for="folder in allFolders" :key="folder.file_id" :label="folder.file_name" :value="folder.file_id"></el-option>
            </el-select>
            <template #footer>
                <el-button @click="moveDialogVisible = false">取消</el-button>
                <el-button type="primary" @click="confirmMove" :loading="moveLoading">确认移动</el-button>
            </template>
        </el-dialog>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        // 配置
        const API_BASE = 'http://192.168.2.131:8080';  // 请根据实际后端地址修改
        const CHUNK_SIZE = 5 * 1024 * 1024;   // 5MB
        const MAX_CONCURRENT_UPLOADS = 3;

        createApp({
            setup() {
                // 登录状态
                const isLoggedIn = ref(!!localStorage.getItem('token'));
                const loginForm = reactive({ username: '', password: '' });
                const loginRules = {
                    username: [{ required: true, message: '请输入用户名', trigger: 'blur' }],
                    password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
                };
                const loginLoading = ref(false);
                const loginMsg = ref('');
                
                // 主数据
                const currentParentId = ref(0);
                const pathStack = ref([{ id: 0, name: '根目录' }]);
                const fileList = ref([]);
                const newFolderName = ref('');
                const mkdirLoading = ref(false);
                const usedQuota = ref(0);
                const totalQuota = ref(5 * 1024 * 1024 * 1024);  // 默认5GB，后续可从接口获取
                
                // 上传任务
                const activeTasks = ref(new Map());  // id -> task对象
                
                // 移动文件
                const moveDialogVisible = ref(false);
                const moveFileId = ref(null);
                const targetParentId = ref(0);
                const moveLoading = ref(false);
                const allFolders = ref([]);
                
                // 辅助函数
                const formatSize = (bytes) => {
                    if (bytes === 0) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                };
                
                const getFileIcon = (filename) => {
                    const ext = filename.split('.').pop().toLowerCase();
                    if (['jpg','jpeg','png','gif','bmp'].includes(ext)) return '🖼️';
                    if (['mp4','mkv','avi','mov'].includes(ext)) return '🎬';
                    if (['mp3','wav','flac'].includes(ext)) return '🎵';
                    if (['pdf'].includes(ext)) return '📄';
                    if (['doc','docx'].includes(ext)) return '📃';
                    if (['xls','xlsx'].includes(ext)) return '📊';
                    if (['zip','rar','7z'].includes(ext)) return '🗜️';
                    return '📄';
                };
                
                // API 请求封装
                const api = async (url, data) => {
                    const headers = { 'Content-Type': 'application/json' };
                    const token = localStorage.getItem('token');
                    if (token) headers['Token'] = token;
                    try {
                        const res = await axios.post(API_BASE + url, data, { headers });
                        if (res.data.code === 401) {
                            localStorage.removeItem('token');
                            isLoggedIn.value = false;
                            ElMessage.error('登录已过期，请重新登录');
                            setTimeout(() => location.reload(), 1500);
                            throw new Error('Unauthorized');
                        }
                        return res.data;
                    } catch (e) {
                        console.error(e);
                        throw e;
                    }
                };
                
                // 加载文件列表
                const loadFiles = async () => {
                    try {
                        const res = await api('/api/files/list', { parent_id: currentParentId.value });
                        if (res.code === 0) fileList.value = res.data;
                        else ElMessage.error(res.msg || '加载失败');
                    } catch (e) {
                        ElMessage.error('网络错误');
                    }
                };
                
                // 获取所有文件夹（用于移动）
                const loadAllFolders = async () => {
                    try {
                        const res = await api('/api/files/list', { fetch_all: 1 });
                        if (res.code === 0) {
                            allFolders.value = res.data.filter(item => item.file_type === 1);
                        }
                    } catch (e) {}
                };
                
                // 导航
                const navigateTo = (id, idx) => {
                    pathStack.value = pathStack.value.slice(0, idx + 1);
                    currentParentId.value = id;
                    loadFiles();
                };
                const goRoot = () => {
                    pathStack.value = [{ id: 0, name: '根目录' }];
                    currentParentId.value = 0;
                    loadFiles();
                };
                const enterFolder = (id, name) => {
                    pathStack.value.push({ id, name });
                    currentParentId.value = id;
                    loadFiles();
                };
                const handleRowDoubleClick = (row) => {
                    if (row.file_type === 1) enterFolder(row.file_id, row.file_name);
                };
                
                // 新建文件夹
                const createFolder = async () => {
                    if (!newFolderName.value.trim()) return ElMessage.warning('请输入文件夹名称');
                    mkdirLoading.value = true;
                    try {
                        const res = await api('/api/files/mkdir', { parent_id: currentParentId.value, folder_name: newFolderName.value });
                        if (res.code === 0) {
                            ElMessage.success('创建成功');
                            newFolderName.value = '';
                            loadFiles();
                        } else ElMessage.error(res.msg);
                    } finally { mkdirLoading.value = false; }
                };
                
                // 重命名
                const renameFile = async (fileId, oldName) => {
                    const newName = prompt('请输入新名称', oldName);
                    if (!newName || newName === oldName) return;
                    const res = await api('/api/files/rename', { file_id: fileId, new_name: newName });
                    if (res.code === 0) { ElMessage.success('重命名成功'); loadFiles(); }
                    else ElMessage.error(res.msg);
                };
                
                // 删除
                const deleteFile = async (fileId) => {
                    await ElMessageBox.confirm('确定删除吗？文件夹必须为空才能删除。', '提示', { type: 'warning' });
                    const res = await api('/api/files/delete', { file_id: fileId });
                    if (res.code === 0) { ElMessage.success('删除成功'); loadFiles(); }
                    else ElMessage.error(res.msg);
                };
                
                // 下载
                const downloadFile = async (fileId, fileName) => {
                    try {
                        const token = localStorage.getItem('token');
                        const response = await axios.post(API_BASE + '/api/files/download', { file_id: fileId }, {
                            headers: { 'Token': token, 'Content-Type': 'application/json' },
                            responseType: 'blob'
                        });
                        const url = window.URL.createObjectURL(new Blob([response.data]));
                        const link = document.createElement('a');
                        link.href = url;
                        link.setAttribute('download', fileName);
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                        window.URL.revokeObjectURL(url);
                    } catch (e) {
                        ElMessage.error('下载失败');
                    }
                };
                
                // 预览：直接打开新窗口
                const previewFile = (fileId, fileName) => {
                    const token = localStorage.getItem('token');
                    const url = `${API_BASE}/api/files/view?file_id=${fileId}&token=${token}`;
                    window.open(url, '_blank');
                };
                
                // 移动文件
                const openMoveModal = async (fileId) => {
                    moveFileId.value = fileId;
                    await loadAllFolders();
                    moveDialogVisible.value = true;
                    targetParentId.value = 0;
                };
                const confirmMove = async () => {
                    moveLoading.value = true;
                    try {
                        const res = await api('/api/files/move', { file_id: moveFileId.value, target_parent_id: targetParentId.value });
                        if (res.code === 0) { ElMessage.success('移动成功'); moveDialogVisible.value = false; loadFiles(); }
                        else ElMessage.error(res.msg);
                    } finally { moveLoading.value = false; }
                };
                
                // 上传任务类 (简化版)
                class UploadTask {
                    constructor(file, onComplete, onError) {
                        this.file = file;
                        this.id = `${file.name}_${file.size}_${file.lastModified}`.replace(/\W/g, '_');
                        this.status = 'PENDING';   // PENDING, UPLOADING, PAUSED, FINISHED, ERROR
                        this.progress = 0;
                        this.offset = 0;
                        this.md5 = null;
                        this.controller = null;
                        this.onComplete = onComplete;
                        this.onError = onError;
                        this.retryCount = 0;
                        this.statusText = '等待中';
                        // 尝试加载本地断点
                        this.loadFromStorage();
                    }
                    
                    loadFromStorage() {
                        const saved = localStorage.getItem(`upload_${this.id}`);
                        if (saved) {
                            const data = JSON.parse(saved);
                            if (data.md5 && data.offset > 0) {
                                this.md5 = data.md5;
                                this.offset = data.offset;
                                this.progress = Math.floor((this.offset / this.file.size) * 100);
                            }
                        }
                    }
                    saveToStorage() {
                        if (this.md5 && this.offset > 0) {
                            localStorage.setItem(`upload_${this.id}`, JSON.stringify({ md5: this.md5, offset: this.offset, timestamp: Date.now() }));
                        }
                    }
                    clearStorage() {
                        localStorage.removeItem(`upload_${this.id}`);
                    }
                    
                    async start() {
                        if (this.status !== 'PENDING' && this.status !== 'PAUSED' && this.status !== 'ERROR') return;
                        this.status = 'UPLOADING';
                        this.statusText = '上传中...';
                        this.controller = new AbortController();
                        this.updateUI();
                        try {
                            if (!this.md5) {
                                this.statusText = '计算MD5...';
                                this.updateUI();
                                this.md5 = await this.calcMD5();
                            }
                            this.statusText = '检查上传状态...';
                            this.updateUI();
                            const checkRes = await this.checkUpload();
                            if (checkRes.status === 'instant') {
                                this.finish();
                                return;
                            }
                            const serverOffset = checkRes.offset || 0;
                            this.offset = Math.max(this.offset, serverOffset);
                            this.saveToStorage();
                            const totalSize = this.file.size;
                            while (this.offset < totalSize && this.status === 'UPLOADING') {
                                const end = Math.min(this.offset + CHUNK_SIZE, totalSize);
                                const chunk = this.file.slice(this.offset, end);
                                const confirmedOffset = await this.uploadChunk(this.md5, this.offset, chunk);
                                if (confirmedOffset > this.offset) this.offset = confirmedOffset;
                                else this.offset = end;
                                this.progress = Math.floor((this.offset / totalSize) * 100);
                                this.saveToStorage();
                                this.updateUI();
                            }
                            if (this.status === 'UPLOADING') {
                                this.statusText = '完成上传...';
                                this.updateUI();
                                await this.completeUpload();
                                this.finish();
                            }
                        } catch (error) {
                            if (error.name === 'AbortError') {
                                this.status = 'PAUSED';
                                this.statusText = `已暂停 ${(this.offset/1024/1024).toFixed(1)}MB`;
                                this.saveToStorage();
                            } else {
                                console.error(error);
                                this.status = 'ERROR';
                                this.statusText = '上传失败';
                                this.retryCount++;
                                if (this.retryCount < 3) {
                                    setTimeout(() => this.start(), 2000);
                                } else {
                                    this.onError(this);
                                }
                            }
                            this.updateUI();
                        }
                    }
                    
                    async calcMD5() {
                        return new Promise((resolve) => {
                            const spark = new SparkMD5.ArrayBuffer();
                            const reader = new FileReader();
                            let chunkIndex = 0;
                            const chunkSize = 5 * 1024 * 1024;
                            const chunks = Math.ceil(this.file.size / chunkSize);
                            const loadNext = () => {
                                const start = chunkIndex * chunkSize;
                                const end = Math.min(start + chunkSize, this.file.size);
                                reader.readAsArrayBuffer(this.file.slice(start, end));
                            };
                            reader.onload = e => {
                                spark.append(e.target.result);
                                chunkIndex++;
                                if (chunkIndex < chunks) setTimeout(loadNext, 0);
                                else resolve(spark.end());
                            };
                            loadNext();
                        });
                    }
                    
                    async checkUpload() {
                        const res = await api('/api/files/upload/check', {
                            md5: this.md5,
                            file_size: this.file.size,
                            file_name: this.file.name,
                            parent_id: currentParentId.value
                        });
                        if (res.code !== 0) throw new Error(res.msg);
                        return { status: res.data.status, offset: res.data.offset };
                    }
                    
                    async uploadChunk(md5, offset, chunk) {
                        const url = `${API_BASE}/api/files/upload/chunk?md5=${md5}&offset=${offset}`;
                        const token = localStorage.getItem('token');
                        const response = await axios.post(url, chunk, {
                            headers: { 'Token': token, 'Content-Type': 'application/octet-stream' },
                            signal: this.controller.signal
                        });
                        if (response.data.code === 0 && response.data.data && response.data.data.offset !== undefined)
                            return response.data.data.offset;
                        return offset + chunk.size;
                    }
                    
                    async completeUpload() {
                        await api('/api/files/upload/complete', {
                            md5: this.md5,
                            file_name: this.file.name,
                            parent_id: currentParentId.value
                        });
                    }
                    
                    finish() {
                        this.status = 'FINISHED';
                        this.progress = 100;
                        this.statusText = '已完成';
                        this.clearStorage();
                        this.updateUI();
                        this.onComplete(this);
                        setTimeout(() => {
                            if (activeTasks.value.has(this.id)) activeTasks.value.delete(this.id);
                        }, 3000);
                    }
                    
                    updateUI() {
                        const tasksMap = activeTasks.value;
                        // 触发响应式更新
                        tasksMap.set(this.id, this);
                        activeTasks.value = new Map(tasksMap);
                    }
                    
                    pause() {
                        if (this.status === 'UPLOADING' && this.controller) {
                            this.controller.abort();
                        }
                    }
                    
                    resume() {
                        if (this.status === 'PAUSED') {
                            this.start();
                        }
                    }
                    
                    retry() {
                        if (this.status === 'ERROR') {
                            this.retryCount = 0;
                            this.status = 'PENDING';
                            this.statusText = '等待重试';
                            this.updateUI();
                            this.start();
                        }
                    }
                }
                
                const activeTaskList = computed(() => Array.from(activeTasks.value.values()).filter(t => t.status !== 'FINISHED'));
                
                // 并发上传队列
                let runningUploads = 0;
                const uploadQueue = [];
                const processQueue = () => {
                    while (runningUploads < MAX_CONCURRENT_UPLOADS && uploadQueue.length) {
                        const task = uploadQueue.shift();
                        runningUploads++;
                        task.start().finally(() => {
                            runningUploads--;
                            processQueue();
                        });
                    }
                };
                const addUploadTask = (task) => {
                    activeTasks.value.set(task.id, task);
                    uploadQueue.push(task);
                    processQueue();
                };
                
                const handleFileSelect = (file) => {
                    const task = new UploadTask(file.raw, 
                        () => { loadFiles(); },
                        () => { ElMessage.error(`上传失败: ${file.name}`); }
                    );
                    addUploadTask(task);
                };
                
                const pauseTask = (id) => {
                    const task = activeTasks.value.get(id);
                    if (task) task.pause();
                };
                const resumeTask = (id) => {
                    const task = activeTasks.value.get(id);
                    if (task) task.resume();
                };
                const retryTask = (id) => {
                    const task = activeTasks.value.get(id);
                    if (task) task.retry();
                };
                
                // 登录注册
                const doLogin = async () => {
                    loginLoading.value = true;
                    try {
                        const res = await axios.post(API_BASE + '/api/user/login', { username: loginForm.username, password: loginForm.password });
                        if (res.data.code === 0) {
                            localStorage.setItem('token', res.data.data.token);
                            isLoggedIn.value = true;
                            ElMessage.success('登录成功');
                            loadFiles();
                        } else {
                            loginMsg.value = res.data.msg;
                        }
                    } catch (e) { loginMsg.value = '网络错误'; }
                    finally { loginLoading.value = false; }
                };
                const doRegister = async () => {
                    try {
                        const res = await axios.post(API_BASE + '/api/user/register', { username: loginForm.username, password: loginForm.password });
                        if (res.data.code === 0) {
                            ElMessage.success('注册成功，请登录');
                        } else {
                            ElMessage.error(res.data.msg);
                        }
                    } catch (e) { ElMessage.error('注册失败'); }
                };
                const logout = () => {
                    localStorage.removeItem('token');
                    isLoggedIn.value = false;
                    pathStack.value = [{ id: 0, name: '根目录' }];
                    currentParentId.value = 0;
                    ElMessage.info('已退出登录');
                };
                
                // 监听登录状态变化自动加载
                onMounted(() => {
                    if (isLoggedIn.value) loadFiles();
                });
                
                return {
                    isLoggedIn, loginForm, loginRules, loginLoading, loginMsg,
                    currentParentId, pathStack, fileList, newFolderName, mkdirLoading, usedQuota, totalQuota,
                    activeTaskList, moveDialogVisible, targetParentId, moveLoading, allFolders,
                    formatSize, getFileIcon, navigateTo, goRoot, enterFolder, handleRowDoubleClick,
                    createFolder, renameFile, deleteFile, downloadFile, previewFile, openMoveModal, confirmMove,
                    handleFileSelect, pauseTask, resumeTask, retryTask,
                    doLogin, doRegister, logout
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
